services:
  smartpantry-db:
    image: postgres:16
    container_name: smartpantry-db
    environment:
      POSTGRES_DB: smartpantry_db
      POSTGRES_USER: smartpantry_user
      POSTGRES_PASSWORD: smartpantry_password
    ports:
      - "5432:5432"
    volumes:
      - smartpantry_postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartpantry-backend
    environment:
      DATABASE_URL: postgresql+psycopg://smartpantry_user:smartpantry_password@smartpantry-db:5432/smartpantry_db
      APP_NAME: Smart Pantry API
      APP_ENV: dev
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      JWT_SECRET_KEY: change-me-in-local-env
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - smartpantry-db

  ai-worker:
    build:
      context: .
      dockerfile: ai_server/Dockerfile
    container_name: smartpantry-ai-worker
    environment:
      DATABASE_URL: postgresql+psycopg://smartpantry_user:smartpantry_password@smartpantry-db:5432/smartpantry_db
      AI_SERVER_HOST: 0.0.0.0
      AI_SERVER_PORT: 8100
      AI_WORKER_POLL_INTERVAL_SECONDS: 5
      AI_WORKER_BATCH_SIZE: 1
      AI_JOB_TIMEOUT_SECONDS: 300
      OLLAMA_BASE_URL: http://localhost:11434
      LLM_TEXT_MODEL: qwen2.5:7b
      LLM_VISION_MODEL: qwen3-vl:8b
    depends_on:
      - smartpantry-db

volumes:
  smartpantry_postgres_data:
